services:
  - type: web
    name: crypto-bot
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATA_DIR
        value: /var/data
      - key: HELIUS_API_KEY
        sync: false
      - key: SOLANA_PUBLIC_KEY
        sync: false
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: UI_PASSWORD
        sync: false
      - key: UI_PASS_IVAN        # Natjecanje: each player logs in with their name + own password
        sync: false
      - key: UI_PASS_PANDA
        sync: false
      - key: UI_PASS_JURE
        sync: false
      - key: HELIUS_PROJECT_ID   # dashboard.helius.dev/projects/<id>: real credit usage for /usage
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: KOL_HOOK_KEY
        sync: false
      - key: HELIUS_RPC_RPS      # Developer plan: 50 RPC/s, keep headroom
        value: "40"
      - key: HELIUS_ENHANCED_RPS
        value: "8"
      - key: TGSTAT_TOKEN         # paid: TGStat Search API, Telegram posts by CA across all channels
        sync: false
      - key: SOLANATRACKER_API_KEY # paid: Solana Tracker KOL leaderboard (all KOL wallets with PnL)
        sync: false
      - key: TG_API_ID            # optional Telegram account for the live listener (my.telegram.org)
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION           # made once with: python3 run_tg.py login
        sync: false
      - key: TRADE_LIVE
        value: "0"
