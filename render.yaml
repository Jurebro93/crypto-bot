services:
  - type: web
    name: crypto-bot
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATA_DIR
        value: /var/data
      - key: HELIUS_API_KEY
        sync: false
      - key: SOLANA_PUBLIC_KEY
        sync: false
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: UI_PASSWORD
        sync: false
      - key: TRADE_LIVE
        value: "0"
