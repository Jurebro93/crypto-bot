services:
  - type: web
    name: crypto-bot
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATA_DIR
        value: /var/data
      - key: HELIUS_API_KEY
        sync: false
      - key: SOLANA_PUBLIC_KEY
        sync: false
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: UI_PASSWORD
        sync: false
      - key: UI_PASS_IVAN        # Natjecanje: each player logs in with their name + own password
        sync: false
      - key: UI_PASS_PANDA
        sync: false
      - key: UI_PASS_JURE
        sync: false
      - key: HELIUS_PROJECT_ID   # dashboard.helius.dev/projects/<id>: real credit usage for /usage
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: KOL_HOOK_KEY
        sync: false
      - key: HELIUS_RPC_RPS      # Developer plan: 50 RPC/s, keep headroom
        value: "40"
      - key: HELIUS_ENHANCED_RPS
        value: "8"
      - key: ANTHROPIC_API_KEY   # morning report: Claude writes the interpretation (~$0.15/day)
        sync: false
      - key: REPORT_EMAIL_TO     # morning report recipient(s), comma separated
        sync: false
      - key: SMTP_USER           # Gmail address that sends the report (with SMTP_PASSWORD = Gmail app password)
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: REPORT_HOUR         # local hour (Europe/Zagreb) of the morning report
        value: "7"
      - key: TRADE_LIVE
        value: "0"
